# Invite & Onboarding Flow — Worked Example
# ============================================================
# Complete onboarding flow for a Business Ops domain authority.
# ============================================================

# version: 1.0.0
# last_updated: 2026-08-02

login_request:
  method: POST
  url: /api/auth/login
  body:
    username: root
    password: "********"

login_response:
  status: 200
  body:
    access_token: "eyJhbGciOiJIUzI1NiIs..."
    token_type: bearer

invite_request:
  method: POST
  url: /api/auth/invite
  headers:
    Authorization: "Bearer eyJhbGciOiJIUzI1NiIs..."
  body:
    username: alice-ops
    role: admin
    governed_modules:
      - "domain/bizops/auto-repair/v1"
    email: null

invite_response:
  status: 200
  body:
    user_id: "a1b2c3d4-e5f6-4000-8000-000000000001"
    username: alice-ops
    role: admin
    governed_modules:
      - "domain/bizops/auto-repair/v1"
    setup_token: "inv_a1b2c3d4e5f6..."
    setup_url: "https://lumina.example.org/api/auth/setup-password?token=inv_a1b2c3d4e5f6..."
    email_sent: false

setup_password_request:
  method: POST
  url: /api/auth/setup-password
  body:
    token: "inv_a1b2c3d4e5f6..."
    new_password: "correct-horse-battery-staple"

setup_password_response:
  status: 200
  body:
    access_token: "eyJhbGciOiJIUzI1NiIs..."
    token_type: bearer

verify_login_request:
  method: POST
  url: /api/auth/login
  body:
    username: alice-ops
    password: "correct-horse-battery-staple"

verify_login_response:
  status: 200
  body:
    access_token: "eyJhbGciOiJIUzI1NiIs..."
    token_type: bearer
