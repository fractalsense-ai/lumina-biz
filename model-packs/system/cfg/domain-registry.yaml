# domain-registry.yaml — Multi-domain registry for Project Lumina
#
# version: 1.0.0
# last_updated: 2026-03-20
#
# Maps each domain_id to its runtime-config.yaml path.
# Set LUMINA_DOMAIN_REGISTRY_PATH to this file to enable multi-domain routing.
# When a domain registry is active, requests specify domain_id to select a domain.
#
# See: standards/domain-registry-schema-v1.json

# Fallback domain for unauthenticated (anonymous) sessions.
# Set this to a "welcome" or "landing" domain pack when one exists.
# Defaults to default_domain when absent.
unauthenticated_domain: business-ops

# Fallback domain for authenticated users whose role is not listed in
# role_defaults below.
default_domain: business-ops

# Role-based default: when NLP routing returns no confident match, authenticated
# users with these roles are routed to the specified domain instead of the global
# default_domain.  Roles not listed fall through to default_domain.
#
# Design rationale: system-level operators (root, super_admin) should land in the
# system domain so they can query Lumina internals without being dropped into a
# domain-specific session. Domain-level users fall through to default_domain.
role_defaults:
  root: system
  super_admin: system

domains:
  business-ops:
    runtime_config_path: model-packs/business-ops/cfg/runtime-config.yaml
    label: Business Ops — Auto Repair
    description: Business operations domain with deterministic governance and evidence capture.
    module_prefix: biz
    keywords:
      - work order
      - service ticket
      - repair
      - parts
      - estimate
      - operations

  system:
    runtime_config_path: model-packs/system/cfg/runtime-config.yaml
    label: System — Lumina Infrastructure
    description: System domain for Project Lumina infrastructure queries. Routes admin and operator questions about System Log records, domain physics, RBAC, policy gates, and Lumina operational concepts. Only root and super_admin roles may execute sessions in this domain.
    module_prefix: sys
    keywords:
      - ctl
      - ledger
      - commitment
      - trace event
      - escalation
      - standing order
      - invariant
      - system physics
      - domain physics
      - domain pack
      - domain authority

  coding-agent:
    runtime_config_path: model-packs/coding-agent/cfg/runtime-config.yaml
    label: Coding Agent — Bounded Artifact Factory
    description: Coding-agent model pack for System Pack-approved artifact generation, validation, and patch review.
    module_prefix: ca
    keywords:
      - coding agent
      - code generation
      - artifact factory
      - patch
      - validation
      - ci
      - pull request
      - repository

  # ── Template domain (commented out) ──────────────────────────────
  # Uncomment and customise when building a new domain from the template.
  # See: model-packs/template/README.md
